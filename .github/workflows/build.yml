name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an in-progress build; tag builds always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev libgl-dev libegl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      # Slint is built from source (Rust); caching the build tree saves ~10 minutes.
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: |
            build
            ~/.cargo/registry
            ~/.cargo/git
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}-
            build-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Stage
        run: cmake --install build --prefix stage

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path stage\* -DestinationPath dist\MotionVRBridge-Windows-Portable.zip
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\NSIS"
          }
          $version = "${{ steps.version.outputs.version }}"
          $stage = (Resolve-Path stage).Path
          makensis /DSTAGE="$stage" /DVERSION="$version" /DOUTFILE="$PWD\dist\MotionVRBridge-Windows-Setup.exe" packaging\windows\installer.nsi
          makensis /DSTAGE="$stage" /DVERSION="$version" /DDRIVER_ONLY /DOUTFILE="$PWD\dist\MotionVRBridge-SteamVR-Driver-Setup.exe" packaging\windows\installer.nsi

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          # Installing rewrites rpaths, which breaks the linker signature; re-sign ad hoc.
          codesign --force --deep -s - stage/MotionVRBridge.app
          codesign --verify --deep --strict stage/MotionVRBridge.app
          ditto -c -k --keepParent stage/MotionVRBridge.app dist/MotionVRBridge-macOS.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/MotionVRBridge-Linux-x64.tar.gz -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: MotionVRBridge-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
